<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페어링의 정석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ── 디자인 토큰: design.png에서 추출 ───────────────────── */
:root{
  --paper:#FBF4EC;        /* 이미지 배경 아이보리 */
  --paper-2:#F6E9E0;      /* 접시 그림자 톤 */
  --card:#FFFCF8;
  --wine-900:#3E0B19;     /* 가장 짙은 레터링 */
  --wine-700:#6E1427;     /* 메인 버건디 */
  --wine-500:#9A2A3F;     /* 하이라이트 버건디 */
  --wine-100:#F3DEDF;
  --gold:#B8874B;         /* 레터링 광택 */
  --ink:#2B1A1D;
  --ink-soft:#6B5458;
  --line:#E8D6CF;
  --focus:#9A2A3F;

  --t-red:#7A1730; --t-white:#C9A646; --t-rose:#D9768A;
  --t-spark:#B8955A; --t-dessert:#C27A2C; --t-fort:#7B4A2D;

  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --sans:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-sm:10px; --r-md:18px; --r-lg:28px;
  --shadow:0 1px 0 rgba(62,11,25,.04),0 10px 30px -18px rgba(62,11,25,.35);
  --shadow-up:0 2px 0 rgba(62,11,25,.04),0 22px 40px -20px rgba(62,11,25,.45);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── 히어로 ───────────────────────────────── */
.hero{position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr;align-items:center;gap:8px;padding-top:12px}
.hero-img{width:min(100%,560px);margin:0 auto;display:block;aspect-ratio:1/1;
  -webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);
  animation:float 1.2s var(--ease) both}
.hero-copy{text-align:center;padding-bottom:8px;animation:rise .9s .15s var(--ease) both}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.18em;color:var(--wine-500);font-weight:700}
.hero h1{font-family:var(--serif);font-weight:900;color:var(--wine-900);font-size:clamp(26px,5vw,40px);line-height:1.3;margin:10px 0 8px}
.hero p{color:var(--ink-soft);margin:0 auto;max-width:34em}
@media (min-width:860px){
  .hero .wrap{grid-template-columns:1fr 1.05fr;gap:24px;padding-top:24px}
  .hero-copy{text-align:left;order:-1;padding-bottom:0}
  .hero p{margin:0}
}
.sparkle{width:14px;height:14px;fill:var(--wine-500)}

/* ── 요약 숫자 ───────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-weight:900;color:var(--wine-700);font-size:clamp(26px,5.5vw,38px);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-soft)}
.stat small{display:block;font-size:12px;color:var(--ink-soft);opacity:.85}
@media (min-width:860px){.hero-copy .stats{max-width:460px}}

/* ── 툴바(검색·필터) ─────────────────────── */
.toolbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.toolbar.stuck{border-bottom-color:var(--line)}
.toolbar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px;padding-bottom:14px}
.search{grid-column:1/-1;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--wine-700);fill:none;stroke-width:2}
.search input{width:100%;min-height:52px;padding:0 48px 0 46px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:16px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:#9A8589}
.search input:focus{outline:none;border-color:var(--wine-500);box-shadow:0 0 0 4px var(--wine-100)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink-soft);font-size:20px;display:none}
.clear.show{display:block}
.clear:hover{background:var(--wine-100);color:var(--wine-700)}
.select{position:relative}
.select label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 4px 6px}
.select select{appearance:none;-webkit-appearance:none;width:100%;min-height:46px;padding:0 38px 0 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-size:15px;cursor:pointer;transition:border-color .2s}
.select select:hover{border-color:var(--wine-500)}
.select::after{content:"";position:absolute;right:16px;bottom:19px;width:8px;height:8px;border-right:2px solid var(--wine-700);border-bottom:2px solid var(--wine-700);transform:rotate(45deg);pointer-events:none}
.select select.on{border-color:var(--wine-700);background:var(--wine-100);color:var(--wine-900);font-weight:700}
@media (min-width:860px){
  .toolbar .wrap{grid-template-columns:2fr 1fr 1fr;align-items:end}
  .search{grid-column:auto}
}

.resultbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 14px}
.resultbar p{margin:0;color:var(--ink-soft);font-size:14px}
.resultbar p b{color:var(--wine-700);font-size:18px;font-family:var(--serif)}
.reset{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--wine-700);background:transparent;color:var(--wine-700);font-weight:700;cursor:pointer;transition:background .2s,color .2s;font-size:14px}
.reset:hover{background:var(--wine-700);color:#fff}
.reset[hidden]{display:none}
.more{display:flex;justify-content:center;margin:-32px 0 56px}

/* ── 카드 ───────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:56px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-up);border-color:#DDBFB8}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tc)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.side{min-width:0;display:flex;flex-direction:column;gap:6px}
.side .label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-soft)}
.side h3{margin:0;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35;color:var(--wine-900)}
.side.food{text-align:right;align-items:flex-end}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,#fff)}
.icon svg{width:22px;height:22px}
.join{display:grid;place-items:center;padding-top:22px}
.join svg{width:20px;height:20px;fill:var(--gold);transition:transform .6s var(--ease)}
.card:hover .join svg{transform:rotate(90deg) scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.side.food .chips{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--wine-500);background:var(--wine-100)}
.chip.type{background:color-mix(in srgb,var(--tc) 15%,#fff);border-color:color-mix(in srgb,var(--tc) 40%,#fff);color:color-mix(in srgb,var(--tc) 70%,#000)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--line);background:#fff}
.score{display:flex;align-items:center;gap:10px;margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.stars{display:flex;gap:2px}
.stars svg{width:16px;height:16px}
.stars .f{fill:var(--wine-700)}
.card[data-s="1"] .bar i,.card[data-s="2"] .bar i{background:linear-gradient(90deg,#C7A49C,#9C6B4E)}
.card[data-s="1"] .stars .f,.card[data-s="2"] .stars .f{fill:#9C6B4E}
.stars .e{fill:var(--line)}
.bar{flex:1;height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--wine-500),var(--wine-700));transition:width .9s var(--ease)}
.card.in .bar i{width:var(--w)}
.score .num{font-family:var(--serif);font-weight:700;color:var(--wine-700);font-size:15px;white-space:nowrap}
.grade{font-size:12px;font-weight:700;color:#fff;background:var(--g,var(--wine-700));border-radius:6px;padding:1px 7px;white-space:nowrap}
.reason{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-soft)}
.reason li{position:relative;padding-left:16px}
.reason li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
mark{background:linear-gradient(transparent 55%,#F2C9CF 55%);color:inherit;padding:0 1px}

.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--ink-soft)}
.empty svg{width:56px;height:56px;margin-bottom:8px}
.empty strong{display:block;font-family:var(--serif);color:var(--wine-900);font-size:20px;margin-bottom:4px}

footer{border-top:1px solid var(--line);padding:22px 0 32px;font-size:13px;color:var(--ink-soft);text-align:center}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bar i{width:var(--w)!important}
}
</style>
</head>

<script>
(function(){
  "use strict";
  /* CSV 파서 (따옴표·쉼표·개행 대응) */
  function parseCSV(text){
    text = text.replace(/^﻿/, "");
    var rows=[], row=[], f="", q=false;
    for (var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
        else f+=c;
      } else if(c==='"') q=true;
      else if(c===','){row.push(f);f="";}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=""; if(row.length>1||row[0]!=="")rows.push(row); row=[]; }
      else f+=c;
    }
    if(f!==""||row.length){row.push(f);rows.push(row);}
    var head=rows.shift().map(function(h){return h.trim();});
    return rows.map(function(r){var o={};head.forEach(function(h,j){o[h]=(r[j]==null?"":r[j]).trim();});return o;});
  }

  var data = parseCSV(document.getElementById("csv").textContent.trim());
  var V = function(s){ return (s==null||String(s).trim()==="") ? "-" : String(s).trim(); };
  var K = {wine:"와인 품종",type:"와인 종류",food:"음식",cat:"음식 카테고리",score:"페어링 점수",grade:"평가 등급",reason:"평가 이유"};
  var TYPE_COLOR = {"레드":"var(--t-red)","화이트":"var(--t-white)","로제":"var(--t-rose)","스파클링":"var(--t-spark)","디저트 와인":"var(--t-dessert)","주정강화 와인":"var(--t-fort)"};
  var MAX = 5;
  var GRADE_COLOR = {"최상":"#6E1427","좋음":"#9A2A3F","보통":"#8A7378","나쁨":"#9C6B4E","최악":"#5E4A45"};
  var PAGE = 60, shown = PAGE, lastList = [];

  function uniq(key){ var m={}; data.forEach(function(d){ var v=d[key]; if(v) m[v]=(m[v]||0)+1; }); return m; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  /* 요약 숫자 */
  var types=uniq(K.type), foods=uniq(K.food), cats=uniq(K.cat), vars=uniq(K.wine);
  var counts={total:data.length,types:Object.keys(types).length,foods:Object.keys(foods).length};
  document.querySelector('[data-sub="varietals"]').textContent = "품종 "+Object.keys(vars).length+"가지";
  document.querySelector('[data-sub="cats"]').textContent = "카테고리 "+Object.keys(cats).length+"개";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-count]").forEach(function(el){
    var to=counts[el.dataset.count];
    if(reduce){el.textContent=to.toLocaleString("ko-KR");return;}
    var t0=null, dur=1100;
    function step(t){ if(!t0)t0=t; var p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e).toLocaleString("ko-KR"); if(p<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });

  /* 드롭다운 */
  function fill(sel,map){
    Object.keys(map).sort(function(a,b){return map[b]-map[a]||a.localeCompare(b,"ko");}).forEach(function(k){
      var o=document.createElement("option"); o.value=k; o.textContent=k+" ("+map[k]+")"; sel.appendChild(o);
    });
  }
  var $q=document.getElementById("q"), $t=document.getElementById("fType"), $c=document.getElementById("fCat"),
      $grid=document.getElementById("grid"), $status=document.getElementById("status"),
      $reset=document.getElementById("reset"), $clear=document.getElementById("clearQ");
  fill($t,types); fill($c,cats);

  /* 렌더 */
  function hl(text,q){
    var safe=esc(text); if(!q) return safe;
    var i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return safe;
    return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
  }
  function stars(n){
    var s=""; for(var i=1;i<=MAX;i++) s+='<svg class="'+(i<=Math.round(n)?"f":"e")+'" aria-hidden="true"><use href="#star"/></svg>'; return s;
  }
  function card(d,i,q){
    var tc=TYPE_COLOR[d[K.type]]||"var(--wine-700)";
    var sc=parseFloat(d[K.score]); var has=!isNaN(sc);
    var reasons=d[K.reason]?d[K.reason].split(/;\s*/).filter(Boolean):[];
    return '<article class="card" data-s="'+(has?Math.round(sc):"")+'" style="--tc:'+tc+';--i:'+Math.min(i,24)+';--w:'+(has?(sc/MAX*100):0)+'%">'+
      '<div class="pair">'+
        '<div class="side wine">'+
          '<span class="icon" style="color:'+tc+'"><svg aria-hidden="true"><use href="#glass"/></svg></span>'+
          '<span class="label">WINE</span>'+
          '<h3>'+hl(V(d[K.wine]),q)+'</h3>'+
          '<div class="chips">'+(d[K.type]?'<button type="button" class="chip type" data-f="type" data-v="'+esc(d[K.type])+'" aria-label="와인 종류 '+esc(d[K.type])+'로 거르기">'+esc(d[K.type])+'</button>':'<span class="chip static">-</span>')+'</div>'+
        '</div>'+
        '<div class="join" aria-hidden="true"><svg><use href="#sp"/></svg></div>'+
        '<div class="side food">'+
          '<span class="icon" style="color:var(--wine-700)"><svg aria-hidden="true"><use href="#plate"/></svg></span>'+
          '<span class="label">FOOD</span>'+
          '<h3>'+hl(V(d[K.food]),q)+'</h3>'+
          '<div class="chips">'+(d[K.cat]?'<button type="button" class="chip" data-f="cat" data-v="'+esc(d[K.cat])+'" aria-label="음식 카테고리 '+esc(d[K.cat])+'로 거르기">'+esc(d[K.cat])+'</button>':'<span class="chip static">-</span>')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="score">'+
        '<span class="stars" role="img" aria-label="페어링 점수 '+(has?sc:"-")+'점 / '+MAX+'점">'+(has?stars(sc):stars(0))+'</span>'+
        '<span class="bar" aria-hidden="true"><i></i></span>'+
        '<span class="num">'+(has?sc:"-")+'<small style="color:var(--ink-soft);font-weight:500"> / '+MAX+'</small></span>'+
        '<span class="grade" style="--g:'+(GRADE_COLOR[d[K.grade]]||"var(--ink-soft)")+'">'+esc(V(d[K.grade]))+'</span>'+
      '</div>'+
      '<ul class="reason">'+(reasons.length?reasons.map(function(r){return "<li>"+esc(r)+"</li>";}).join(""):"<li>-</li>")+'</ul>'+
    '</article>';
  }

  var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
  },{rootMargin:"0px 0px -40px 0px"}) : null;

  var $more=document.getElementById("more");
  function cardsHTML(list,from,to,q){ return list.slice(from,to).map(function(d,i){return card(d,i,q);}).join(""); }
  function observe(){ $grid.querySelectorAll(".card:not(.obs)").forEach(function(el){ el.classList.add("obs"); io?io.observe(el):el.classList.add("in"); }); }
  function updateMore(){
    var left=lastList.length-shown; $more.hidden=left<=0;
    if(left>0) $more.textContent="조합 더 보기 ("+Math.min(PAGE,left)+"개 · 남은 "+left.toLocaleString("ko-KR")+"개)";
  }
  $more.addEventListener("click",function(){
    var q=$q.value.trim(), from=shown; shown+=PAGE;
    $grid.insertAdjacentHTML("beforeend",cardsHTML(lastList,from,shown,q)); observe(); updateMore();
  });
  function render(){
    var q=$q.value.trim(), t=$t.value, c=$c.value, ql=q.toLowerCase();
    var list=data.filter(function(d){
      if(t && d[K.type]!==t) return false;
      if(c && d[K.cat]!==c) return false;
      if(ql && (d[K.wine]||"").toLowerCase().indexOf(ql)<0 && (d[K.food]||"").toLowerCase().indexOf(ql)<0) return false;
      return true;
    });
    lastList=list; shown=PAGE;
    $grid.innerHTML = list.length ? cardsHTML(list,0,shown,q) :
      '<div class="empty"><svg viewBox="0 0 24 24" style="color:var(--wine-500)" aria-hidden="true"><use href="#glass"/></svg>'+
      '<strong>맞는 조합이 없어요</strong>검색어를 바꾸거나 필터를 초기화해 보세요.</div>';
    observe(); updateMore();
    var active=!!(q||t||c);
    $status.innerHTML = active ? '<b>'+list.length.toLocaleString("ko-KR")+'</b>개 조합 · 전체 '+data.length.toLocaleString("ko-KR")+'개 중' : '전체 <b>'+data.length.toLocaleString("ko-KR")+'</b>개 조합';
    $reset.hidden=!active;
    $clear.classList.toggle("show",!!q);
    $t.classList.toggle("on",!!t); $c.classList.toggle("on",!!c);
  }

  var timer; $q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(render,120);});
  $t.addEventListener("change",render); $c.addEventListener("change",render);
  $clear.addEventListener("click",function(){$q.value="";render();$q.focus();});
  $reset.addEventListener("click",function(){$q.value="";$t.value="";$c.value="";render();});
  $grid.addEventListener("click",function(e){
    var b=e.target.closest(".chip[data-f]"); if(!b) return;
    (b.dataset.f==="type"?$t:$c).value=b.dataset.v; render();
    document.getElementById("toolbar").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="/" && document.activeElement!==$q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$q.focus();}
  });
  var tb=document.getElementById("toolbar");
  window.addEventListener("scroll",function(){tb.classList.toggle("stuck",tb.getBoundingClientRect().top<=0);},{passive:true});

  render();
})();
</script>
</body>
</html>
